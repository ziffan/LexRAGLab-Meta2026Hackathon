<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MG-2 Tech highlight</title>
<!--
  MG-2, adegan T1 (2:10-2:35; MG mengisi 20 dari 25 detik), storyboard terkunci putusan operator 19.
  Pilihan putusan 18: O5 perbandingan model (pasangan effort low), O6 hitungan mentah (bukan persen).
  Aset video, bukan bagian app. Statis, tanpa jaringan: CSS/JS inline, font IBM Plex lokal (video/fonts/, SIL OFL 1.1).
  Parameter URL:
    ?t=9        bekukan frame pada detik 9
    ?play=1     putar real-time (bawaan tanpa ?t)
    ?dur=26      regangkan timeline ke 26 detik (ikuti durasi VO)
    ?delay=2    tahan frame 0 selama 2 detik sebelum mulai
    ?pair=medium  varian alternatif 4.1 "T1 pasangan medium" (bawaan low)
  Semua angka di layar berasal dari objek DATA; sumber per angka di komentarnya dan di video/README.md.
-->
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }
/* Token warna disalin dari frontend/src/theme.css (H-083). */
:root {
  --font-sans: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --bg: #F3F4F1; --ink: #15181C; --surface: #FFFFFF; --line: #D3D7DC; --line-strong: #8A929B;
  --muted: #4B535D; --accent: #1D5BA8; --gold: #FBE3A6; --gold-line: #D9B65A; --skeleton: #E4E7EA;
  --head-bg: #15181C; --head-ink: #FFFFFF; --head-muted: #C9CED4; --series-on: #A8500C;
  --pass-bg: #E3ECF8; --pass-line: #B7CBE8; --pass-text: #1D4E8F;
}
html, body { margin: 0; height: 100%; background: #0B0C0E; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--bg);
  color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
.band { position: absolute; left: 0; top: 0; width: 1920px; height: 12px; background: var(--head-bg); }
.eyebrow { position: absolute; left: 120px; top: 44px; font-size: 24px; font-weight: 500; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
#cost { position: absolute; background: var(--head-bg); color: var(--head-ink); border-radius: 12px; transform-origin: 0 0; padding: 28px 40px; white-space: nowrap; }
#cost .lbl { font-size: 34px; color: var(--head-muted); }
#cost .amt { font-family: var(--font-mono); font-size: 72px; font-weight: 500; color: var(--gold); }
#cost .note { font-size: 26px; color: var(--head-muted); margin-top: 6px; }
h2 { position: absolute; left: 120px; margin: 0; font-size: 38px; font-weight: 600; }
h2 small { font-weight: 400; color: var(--muted); font-size: 28px; margin-left: 14px; }
.bar { position: absolute; left: 120px; width: 1680px; height: 130px; }
.bar .who { font-size: 28px; font-weight: 500; }
.bar .who span { color: var(--muted); font-weight: 400; }
.bar .track { position: absolute; left: 0; top: 46px; width: 1180px; height: 64px; background: var(--skeleton); border-radius: 6px; overflow: hidden; }
.bar .ok { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }
.bar .over { position: absolute; right: 0; top: 0; bottom: 0; background: var(--series-on); }
.bar .num { position: absolute; left: 1220px; top: 34px; font-family: var(--font-mono); font-size: 56px; font-weight: 500; white-space: nowrap; }
.bar .num small { font-family: var(--font-sans); font-size: 26px; font-weight: 400; color: var(--muted); margin-left: 10px; }
.legend { position: absolute; left: 120px; font-size: 24px; color: var(--muted); }
.legend i { display: inline-block; width: 22px; height: 22px; vertical-align: -3px; margin: 0 10px 0 0; border-radius: 3px; }
.col { position: absolute; top: 690px; width: 520px; height: 216px; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; box-sizing: border-box; padding: 22px 28px; }
.col .m { font-family: var(--font-mono); font-size: 27px; font-weight: 500; }
.col .h { font-size: 22px; color: var(--muted); margin-top: 4px; }
.col .r { position: absolute; left: 28px; bottom: 22px; font-family: var(--font-mono); font-size: 48px; font-weight: 500; color: var(--pass-text); }
.col .r small { font-family: var(--font-sans); font-size: 24px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.foot { position: absolute; left: 120px; top: 930px; width: 1680px; font-size: 21px; line-height: 1.4; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"><div class="band"></div><div class="eyebrow">From stored runs</div></div>
<script>
"use strict";
// ---------------------------------------------------------------------------
// DATA: satu-satunya tempat angka. RM = README.md repo app, bagian "Limits".
// ---------------------------------------------------------------------------
const DATA = {
  // RM Limits: "Run cost (main results): 561,741 micro-USD (shown as $0.561741), the same figure and label as the app header."
  run_cost_micro_usd: 561741,
  // config/header_b.toml max_header_tokens = 40; RM Limits: "rejected as semantic_invalid (header over 40 tokens)".
  header_limit_tokens: 40,
  // RM Limits (effort sweep), "Share of role B calls rejected as semantic_invalid (header over 40 tokens)":
  //   Spark Open "816 of 1,783, low", "1,919 of 2,923, medium"; Contributor "142 of 1,926 calls, low", "110 of 1,048, medium".
  header_over: {
    low:    { spark_open: [816, 1783],  contributor: [142, 1926] },
    medium: { spark_open: [1919, 2923], contributor: [110, 1048] },
  },
  // RM Limits (comparators): "On the three must-refuse items every answer abstained in the base runs, for all three models
  // (6 of 6 each; Contributor 4 tolak and 2 bukti_tidak_cukup, Spark Open 5 and 1, Glimmer 4 and 2)."
  must_refuse_items: 3,
  abstain: {
    contributor: { abstained: 6, of: 6, refused: 4, insufficient: 2 },
    spark_open:  { abstained: 6, of: 6, refused: 5, insufficient: 1 },
    glimmer:     { abstained: 6, of: 6, refused: 4, insufficient: 2 },
  },
};
// Label model (RM "What Muse Spark does" dan Limits; NOTICE untuk Glimmer Apache-2.0 per Meta docs; putusan 18 O11).
const MODELS = {
  contributor: { id: "muse-spark-1.3-contributor", host: "Meta Model API · main results" },
  spark_open:  { id: "Muse Spark Open", host: "open-weight · hosted on Baseten" },
  glimmer:     { id: "Muse Glimmer", host: "open-weight · local (Q4_K_M)" },
};
const DUR = 20;   // detik; T1 25 detik, MG-2 18-20 detik (bagian 5 dokumen analisis)

const Q = new URLSearchParams(location.search);
const PAIR = Q.get("pair") === "medium" ? "medium" : "low";
const FOOT = "Muse Spark Open: open-weight, hosted on Baseten. Muse Glimmer: open-weight, running locally on the operator's machine (Q4_K_M), Apache-2.0 per Meta docs. "
  + "Effort shown per bar (" + PAIR + "). Partial role B coverage for comparators. Separate runs, never mixed with main results. "
  + "Prompt tuned on muse-spark-1.3; limit counted by a local tokenizer"
  + (PAIR === "low" ? "; muse-spark-1.3 low mixes prompt v1/v2" : "; Spark Open medium has partial role B coverage")
  + ". Header limit compliance, not answer quality. No quality comparison, no significance test.";

// --------------------------- runtime ---------------------------------------
const stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => x * x * (3 - 2 * x);
const k = (t, a, b) => ease(clamp((t - a) / (b - a)));
const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const usd = (micro) => "$" + Math.floor(micro / 1e6) + "." + String(micro % 1e6).padStart(6, "0");
function el(tag, cls, parent, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; (parent || stage).appendChild(e); return e; }
const U = [];

// (a) lencana biaya: 0-4.5 dtk di tengah, lalu mengecil ke pojok kanan atas.
const cost = el("div"); cost.id = "cost";
el("div", "lbl", cost, "Run cost (main results)");
el("div", "amt", cost, usd(DATA.run_cost_micro_usd));
el("div", "note", cost, "Experiment pools reported separately");
U.push((t) => {
  const m = k(t, 4.2, 5.2), s = 1 - 0.55 * m;
  const x0 = 960 - 330, y0 = 380, x1 = 1920 - 120 - 660 * 0.45, y1 = 30;
  cost.style.left = (x0 + (x1 - x0) * m) + "px"; cost.style.top = (y0 + (y1 - y0) * m) + "px";
  cost.style.transform = "scale(" + s + ")"; cost.style.opacity = k(t, 0.2, 0.8);
});

// (b) dua batang laju header lewat batas.
const hb = el("h2", null, null, "Context headers over the " + DATA.header_limit_tokens + "-token limit");
hb.style.top = "190px"; el("small", null, hb, "role B, reasoning effort " + PAIR);
const BARS = ["spark_open", "contributor"];
const bars = BARS.map((key, i) => {
  const [over, total] = DATA.header_over[PAIR][key];
  const b = el("div", "bar"); b.style.top = (270 + i * 150) + "px";
  const who = el("div", "who", b, MODELS[key].id + "  "); el("span", null, who, MODELS[key].host + " · effort " + PAIR);
  const tr = el("div", "track", b), ok = el("div", "ok", tr), ov = el("div", "over", tr);
  const num = el("div", "num", b, fmt(over)); el("small", null, num, "of " + fmt(total) + " calls");
  return { b, ok, ov, num, frac: over / total, at: 6.0 + i * 1.6 };
});
const lg = el("div", "legend"); lg.style.top = "580px";
lg.innerHTML = '<i style="background:var(--series-on)"></i><span></span><i style="background:var(--accent);margin-left:36px"></i><span></span>';
lg.querySelectorAll("span")[0].textContent = "header over the limit (call rejected)";
lg.querySelectorAll("span")[1].textContent = "within the limit";
U.push((t) => {
  const a = k(t, 5.0, 5.6); hb.style.opacity = a; lg.style.opacity = k(t, 7.0, 7.6);
  bars.forEach((r) => {
    r.b.style.opacity = k(t, r.at - 0.6, r.at);
    const g = k(t, r.at, r.at + 1.6);
    r.ok.style.width = (1180 * (1 - r.frac) * g) + "px";
    r.ov.style.width = (1180 * r.frac * g) + "px";
    r.num.style.opacity = k(t, r.at + 1.2, r.at + 1.8);
  });
});

// (c) abstain pada butir must-refuse, tiga model.
const hc = el("h2", null, null, "On " + DATA.must_refuse_items + " must-refuse questions (best and baseline profile each)");
hc.style.top = "636px";
const COLS = ["contributor", "spark_open", "glimmer"];
const cols = COLS.map((key, i) => {
  const a = DATA.abstain[key];
  const c = el("div", "col"); c.style.left = (120 + i * 580) + "px";
  el("div", "m", c, MODELS[key].id); el("div", "h", c, MODELS[key].host);
  el("div", "h", c, a.refused + " refused, " + a.insufficient + " insufficient evidence");
  const r = el("div", "r", c, a.abstained + " of " + a.of); el("small", null, r, "abstained");
  return { c, at: 13.6 + i * 0.5 };
});
U.push((t) => {
  hc.style.opacity = k(t, 13.0, 13.6);
  cols.forEach((o) => { o.c.style.opacity = k(t, o.at, o.at + 0.6); o.c.style.transform = "translateY(" + (24 * (1 - k(t, o.at, o.at + 0.6))) + "px)"; });
});

const foot = el("div", "foot", null, FOOT);
U.push((t) => { foot.style.opacity = k(t, 5.4, 6.0); });

function render(t) { U.forEach((u) => u(t)); }
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = "translate(" + (innerWidth - 1920 * s) / 2 + "px," + (innerHeight - 1080 * s) / 2 + "px) scale(" + s + ")";
}
// ?dur=26 meregangkan/memampatkan seluruh timeline secara linear ke 26 detik (menyesuaikan durasi VO); ?t= dalam detik keluaran.
const OUT = Q.has("dur") && parseFloat(Q.get("dur")) > 0 ? parseFloat(Q.get("dur")) : DUR;
const at = (t) => render(clamp(t, 0, OUT) * DUR / OUT);
function start() {
  fit(); addEventListener("resize", fit);
  if (Q.has("t")) { at(parseFloat(Q.get("t")) || 0); document.body.dataset.ready = "1"; return; }
  const delay = 1000 * (parseFloat(Q.get("delay")) || 0);
  at(0); document.body.dataset.ready = "1";
  const t0 = performance.now() + delay;
  const loop = () => { const t = Math.max(0, (performance.now() - t0) / 1000); at(t); if (t < OUT) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.MG = { duration: OUT, render: at };
document.fonts.ready.then(start);
</script>
</body>
</html>
