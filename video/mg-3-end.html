<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MG-3 End card</title>
<!--
  MG-3, kartu akhir di adegan I1 (masuk sekitar 2:50; 8 detik, boleh dipotong 2-5 detik bila edit melewati batas),
  storyboard terkunci putusan operator 19. Disclosure = bagian 6.2 dokumen analisis narasi + putusan 18 O11 + putusan 19 butir 2.
  Aset video, bukan bagian app. Statis, tanpa jaringan: CSS/JS inline, font IBM Plex lokal (video/fonts/, SIL OFL 1.1).
  Parameter URL:
    ?t=6        bekukan frame pada detik 6
    ?play=1     putar real-time (bawaan tanpa ?t)
    ?dur=26      regangkan timeline ke 26 detik (ikuti durasi VO)
    ?delay=2    tahan frame 0 selama 2 detik sebelum mulai
    ?hook=A|B|C|D  samakan baris "problem-size figures" dengan varian hook MG-1 (bawaan A)
  Placeholder operator (DATA.repo_url, DATA.tts_engine) tampil sebagai kotak TODO merah sampai diisi.
-->
<style>
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
/* Token warna disalin dari frontend/src/theme.css (H-083). */
:root {
  --font-sans: "IBM Plex Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --gold: #FBE3A6; --head-bg: #15181C; --head-ink: #FFFFFF; --head-muted: #C9CED4;
  --err-bg: #FBE9E7; --err-text: #8C2318;
}
html, body { margin: 0; height: 100%; background: #0B0C0E; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: var(--head-bg);
  color: var(--head-ink); font-family: var(--font-sans); overflow: hidden; }
#name { position: absolute; left: 120px; top: 70px; font-size: 84px; font-weight: 600; }
#tag { position: absolute; left: 120px; top: 190px; width: 1680px; font-size: 38px; font-weight: 500; line-height: 1.3; }
#rule { position: absolute; left: 120px; top: 310px; height: 8px; background: var(--gold); }
#repo { position: absolute; left: 120px; top: 340px; font-family: var(--font-mono); font-size: 34px; color: var(--gold); }
#list { position: absolute; left: 120px; top: 405px; width: 1680px; margin: 0; padding: 0; list-style: none; }
#list li { font-size: 23px; line-height: 1.32; color: var(--head-muted); margin: 0 0 7px; }
#disc { position: absolute; left: 120px; top: 885px; font-size: 44px; font-weight: 600; }
.todo { background: var(--err-bg); color: var(--err-text); padding: 0 10px; border-radius: 4px; font-family: var(--font-mono); }
</style>
</head>
<body>
<div id="stage"><div id="name"></div><div id="tag"></div><div id="rule"></div><div id="repo"></div><ul id="list"></ul><div id="disc"></div></div>
<script>
"use strict";
const DATA = {
  name: "LexRAGLab",
  // frontend/src/content/tagline.json (status final, disetujui operator 28 Okt) = kalimat pembuka README.
  tagline: "Find the chunking and retrieval setting that feeds an LLM the right clauses of Indonesian legal documents, measured, not guessed.",
  // URL repo publik: diisi 30 Okt (putusan operator 20). Gate unggah tetap mensyaratkan repo publik (H-029). null = tampil sebagai placeholder.
  repo_url: "https://github.com/ziffan/LexRAGLab-Meta2026Hackathon",
  // H-114 (30 Okt): ElevenLabs eleven-v4 lewat OpenRouter, suara bawaan `brian`, bukan kloning orang nyata (semula VoxCPM2 `electra`).
  tts_engine: "ElevenLabs",   // H-114
};
// Disclosure bagian 6.2 dokumen analisis narasi (repo catatan docs/riset/2026-10-30-analisis-narasi-video.md, c983b71).
// Sumber per baris: (1) README "Built before vs during the hackathon", H-083, H-044; (2) README "Data and licensing" (H-028);
// (3) README "Document families" dan "Data and licensing" (H-031, H-045); (4) README "Data and licensing" (H-039, H-041);
// (5) README "What Muse Spark does" dan Limits, NOTICE butir 4 (Glimmer: Apache-2.0 per Meta docs, putusan 18 O11);
// (6) README "Why" (varian hook); (7) README baris "Built with Muse Spark Open" (NOTICE, Muse Model License bagian 2);
// (8) putusan operator 19 butir 2 (pengungkapan suara sintetis).
const PROBLEM_SIZE = {
  A: "Problem-size figures: the operator's measurements of prior engagements, not output of this app.",
  D: "Problem-size figures: the operator's measurements of prior engagements, not output of this app.",
  B: "Problem-size figures: measured in this repository (Company Law corpus, local tokenizer).",
  C: null,
};
const LINES = [
  "Built during the Meta Global AI Developer Hackathon, Oct 26 – Nov 4, 2026. Pre-event material: planning docs and the Company Law text only; the UI theme follows the operator's pre-event design mockup (markup not copied).",
  "Model: muse-spark-1.3-contributor (Contributor mode: Meta may use the content to train future models). Used because every document here is public or synthetic. Confidential documents: use the Standard model ID.",
  "Company Law text: unofficial consolidation of UU 40/2007 by the operator, as of 30 Dec 2022.",
  "Notarial deeds: five synthetic deeds written by an AI agent and reviewed by the operator; all identities fictitious.",
  "Comparators: Muse Spark Open (open-weight, Baseten) and Muse Glimmer (open-weight, Q4_K_M, running locally on the operator's machine; Apache-2.0 per Meta docs), labelled with model and reasoning effort, separate runs, never mixed with main results.",
  "@PROBLEM",
  "Built with Muse Spark Open (tokenizer for local token counts).",
  "@TTS",
  // F9 (operator 30 Okt malam): peran Voice Transcribe (H-113; NOTICE butir 4) dan lisensi atas nama operator (LICENSE, NOTICE, H-097).
  "Narration checked against the script with Muse Voice Transcribe (Meta Model API); not part of the app.",
  "© 2026 Ziffany Firdinal. Code licensed under Apache-2.0.",
];
const DUR = 8;   // detik (bagian 5 dokumen analisis: 6-8 detik)

const Q = new URLSearchParams(location.search);
const HOOK = (Q.get("hook") || "A").toUpperCase();
const stage = document.getElementById("stage");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => x * x * (3 - 2 * x);
const k = (t, a, b) => ease(clamp((t - a) / (b - a)));
const $ = (id) => document.getElementById(id);
function todo(parent, text) { const s = document.createElement("span"); s.className = "todo"; s.textContent = text; parent.appendChild(s); }

$("name").textContent = DATA.name;
$("tag").textContent = DATA.tagline;
if (DATA.repo_url) $("repo").textContent = DATA.repo_url; else todo($("repo"), "TODO operator: public repository URL");
const items = [];
LINES.forEach((line) => {
  let li = null;
  if (line === "@PROBLEM") {
    const txt = PROBLEM_SIZE[HOOK] !== undefined ? PROBLEM_SIZE[HOOK] : PROBLEM_SIZE.A;
    if (!txt) return;
    li = document.createElement("li"); li.textContent = txt;
  } else if (line === "@TTS") {
    li = document.createElement("li");
    if (DATA.tts_engine) li.textContent = "Narration: synthetic voice (" + DATA.tts_engine + " text-to-speech)."; else { li.textContent = "Narration: synthetic voice ("; todo(li, "TODO engine"); li.appendChild(document.createTextNode(" text-to-speech).")); }
  } else { li = document.createElement("li"); li.textContent = line; }
  $("list").appendChild(li); items.push(li);
});
$("disc").textContent = "Research demo. Not legal advice.";

function render(t) {
  const show = (e, a) => { e.style.opacity = k(t, a, a + 0.5); };
  show($("name"), 0.0); show($("tag"), 0.3); show($("repo"), 0.6);
  $("rule").style.width = (1680 * k(t, 0.2, 1.0)) + "px";
  items.forEach((li, i) => show(li, 0.9 + 0.12 * i));
  show($("disc"), 1.0);
}
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = "translate(" + (innerWidth - 1920 * s) / 2 + "px," + (innerHeight - 1080 * s) / 2 + "px) scale(" + s + ")";
}
// ?dur=26 meregangkan/memampatkan seluruh timeline secara linear ke 26 detik (menyesuaikan durasi VO); ?t= dalam detik keluaran.
const OUT = Q.has("dur") && parseFloat(Q.get("dur")) > 0 ? parseFloat(Q.get("dur")) : DUR;
const at = (t) => render(clamp(t, 0, OUT) * DUR / OUT);
function start() {
  fit(); addEventListener("resize", fit);
  if (Q.has("t")) { at(parseFloat(Q.get("t")) || 0); document.body.dataset.ready = "1"; return; }
  const delay = 1000 * (parseFloat(Q.get("delay")) || 0);
  at(0); document.body.dataset.ready = "1";
  const t0 = performance.now() + delay;
  const loop = () => { const t = Math.max(0, (performance.now() - t0) / 1000); at(t); if (t < OUT) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.MG = { duration: OUT, render: at };
document.fonts.ready.then(start);
</script>
</body>
</html>
