# config/model — profil model (docs/ARCHITECTURE.md §7, H-028, H-057).
# Pemilik nilai: operator. Model ID hanya dari berkas ini.
version = 1
default_profile = "meta"
# Label mesin untuk RunRecord.host (bukan hostname; H-027). Usulan agen M0.1 (O-13), operator boleh ubah.
host = "authoritative"

[profiles.meta]
# Jalur otoritatif: satu-satunya jalur untuk angka yang dilaporkan (H-027, H-028).
provider = "meta"
model = "muse-spark-1.3-contributor"
base_url_env = "MUSE_BASE_URL"   # nilai di .env lokal, tidak dicetak
api_key_env = "MUSE_API_KEY"
for_reported_numbers = true

[profiles.openrouter_dev]
# Hanya dev dan uji (H-057). Tidak dipakai untuk angka yang dilaporkan.
provider = "openrouter"
model = "meta/muse-spark-1.3-contributor"
base_url = "https://openrouter.ai/api/v1"
pricing = "meta"   # harga memakai [pricing.meta] (D4, scenarios/M0.1): harga OpenRouter sama dengan Contributor
api_key_env = "OPENROUTER_API_KEY"
for_reported_numbers = false

[effort]
# Nilai valid diuji di G1 smoke (G-05); diisi ulang setelah hasil smoke.
a = "low"
b = "low"
c = "low"
d = "low"
measure = "low"

[pricing.meta]
# Contributor, per 1M token, dalam micro-USD (H-028; harga dicek ulang di M0).
input_per_mtok_micros = 100000
cached_per_mtok_micros = 2000
output_per_mtok_micros = 200000

[limits]
max_rpm = 140          # di bawah 150 RPM Contributor (G-19)
timeout_s = 120
max_retries = 1
# Kunci retry 429 (SECURITY-COMPLIANCE T6; usulan agen M0.1, T1 di docs/scenarios/M0.1.md; operator boleh ubah).
backoff_base_s = 2     # tunggu pertama bila 429 tanpa Retry-After valid
backoff_factor = 2     # eksponensial: 2, 4, 8 detik
max_429_retries = 3    # jatah retry 429, terpisah dari max_retries (jatah retry timeout; O-16)
max_wait_s = 120       # tunggu lebih dari ini (termasuk Retry-After) -> berhenti rate_limited

[profiles.baseten_open]
# Pembanding peran C saja, stretch (H-060). Run terpisah, tidak untuk angka utama (H-028).
# Smoke 27 Okt: Responses API + text.format strict didukung (G-33), jadi pengecualian Chat Completions H-016 tidak dipakai.
provider = "baseten"
model = "meta-models/muse-spark-open-1026"
base_url_env = "BASETEN_BASE_URL"   # nilai di .env lokal, tidak dicetak
api_key_env = "BASETEN_API_KEY"
for_reported_numbers = false
roles = ["c"]
# Harga per 1M token belum dipin: tanpa [pricing.baseten_open] klien fail-closed (config_invalid). Operator mengisi (I-34).
