# config/corpus_akta — korpus keluarga akta sintetis (H-039, H-041, H-054).
# Terpisah dari config/corpus.toml dengan sengaja: seluruh isi corpus.toml ikut hash konfigurasi run grid
# (pipeline CONFIGS, snapshot config_hash, measure). Menambah akta di sana akan mengubah kunci semua run UU PT
# yang sudah tersimpan. Pemuat menggabungkan kedua berkas (backend/corpus/akta.py). USULAN: operator memutus
# apakah akta dipindah ke corpus.toml.
version = 1
# Dicatat di CorpusDoc.loader_rules_version untuk akta. Naikkan bila aturan teks bersih di bawah berubah.
loader_rules_version = "akta-1"

[loader_akta]
# Aturan teks bersih akta (DATA-CONTRACTS §2: pemuat akta hanya memeriksa UTF-8, CR, BOM, dan hash).
# Baris pertama berkas wajib persis disclaimer ini (H-041). Ia dan baris kosong sesudahnya DIBUANG dari teks bersih
# (disimpan di metadata), sama seperti disclaimer editorial UU PT: bukan isi akta, tidak boleh masuk sampel peran A,
# chunker, BM25, atau embedder. Selebihnya teks dipertahankan apa adanya (tanpa normalisasi), sehingga offset
# teks bersih = offset berkas mentah dikurangi panjang awalan yang dibuang.
disclaimer = "[SINTETIS — dokumen fiktif untuk uji LexRAGLab; tidak berlaku hukum; identitas rekaan]"
# Akta tidak punya parser section (sections kosong di DATA-CONTRACTS §2). Chunker skema dan verifikasi offset
# bekerja per section, jadi pemuat memberi satu rentang bernama ini yang mencakup seluruh teks bersih.
section = "batang_tubuh"

