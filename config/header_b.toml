# config/header_b — peran B (contextual chunking), M3.1. Nilai bertanda "usulan agen" boleh diubah operator.
version = 1

# Placeholder; granularitas diputus operator dari angka M3.1 (H-038). Nilai: "pasal" | "ayat".
granularity = "ayat"

# Usulan agen: batas panjang header (token lokal). Potongan ayat rata-rata sekitar 43 token (UU PT, chunker v2),
# jadi header 40 token sudah kira-kira setara satu potongan; lebih panjang dari itu mengikis keuntungan anggaran (H-004).
max_header_tokens = 40

# Usulan agen: ruang keluaran per panggilan. Reasoning ditagih sebagai output dan sekitar 83% keluaran (G-31);
# smoke M0.1 mencatat output 445-452 token pada effort low, jadi 1000 memberi ruang tanpa memotong (G-09).
max_output_tokens = 1000
# Usulan agen: asumsi output per panggilan untuk proyeksi "expected" (dari smoke G-31, 445-452).
expected_output_tokens = 450

# Usulan agen, BELUM DIUKUR: latensi per panggilan berurutan untuk proyeksi waktu. Ukur pada sampel live.
assumed_latency_ms = 3000

# Hentikan run bila sekian panggilan berturut-turut gagal (cegah membakar kuota saat key/model bermasalah).
max_consecutive_errors = 5

[projection]
# RPM dokumentasi Contributor (H-028); proyeksi default memakai [limits].max_rpm config/model (140, G-19).
doc_rpm = 150
