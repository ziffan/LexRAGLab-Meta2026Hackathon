# config/header_b — peran B (contextual chunking), M3.1. Nilai bertanda "usulan agen" boleh diubah operator.
version = 3   # H-101: tabel [max_attempts] dan [projection.glimmer_local] (pembanding B open-weight)

# H-074: granularitas B = pasal (diputus operator); fixed_size tetap dijalankan. Nilai: "pasal" | "ayat".
granularity = "pasal"

# H-069 (A6): cakupan setting header-on di grid. "frontier_only" = hanya kembaran dari frontier tune deret off (H-017);
# "all" = semua kembaran (mahal, memicu permintaan header untuk setting di luar frontier). Penyaring ada di runner grid.
scope = "frontier_only"

# Usulan agen: batas panjang header (token lokal). Potongan ayat rata-rata sekitar 43 token (UU PT, chunker v2),
# jadi header 40 token sudah kira-kira setara satu potongan; lebih panjang dari itu mengikis keuntungan anggaran (H-004).
max_header_tokens = 40

# H-079 (I-47 opsi B): versi prompt B di prompts/b/versions.json. "v2" = aturan penyingkatan judul Bab/Bagian panjang + contoh.
# "v1" tetap dapat dipilih; header v1 tetap tersimpan di direktori prompt_hash-nya sendiri (tidak ditimpa).
prompt_version = "v2"

# H-079: maxLength (karakter) pada properti `header` skema HeaderB. Tidak diisi = tidak dipakai (skema v1, hash skema sama).
# Isi hanya setelah smoke (`python -m backend.header_b --smoke --unit <alamat|chunk_id>`) membuktikan strict Responses menerimanya.
# Usulan agen: 190. Sumber: 1.067 header pasal + 100 header fixed_size v1 yang lolos (runs/headers/*/5de81a0c2feb): maks 180
# karakter (pasal p99 160, fixed_size p99 172); 190 = maks + margin sekitar 5%. 40 token lokal setara sekitar 4,5 karakter/token.
schema_max_length_chars = 190

# Usulan agen: ruang keluaran per panggilan. Reasoning ditagih sebagai output dan sekitar 83% keluaran (G-31);
# smoke M0.1 mencatat output 445-452 token pada effort low, jadi 1000 memberi ruang tanpa memotong (G-09).
max_output_tokens = 1000
# Batas output request pemanas. Harus sama longgarnya dengan panggilan biasa: reasoning effort low saja menghabiskan
# sekitar 83% output (G-31), dan 300 terbukti memotong pemanas (`incomplete (max_output_tokens)`, sampel live 27 Okt).
# Pemanas yang incomplete tetap dihitung gagal.
warm_max_output_tokens = 1000
# Usulan agen: asumsi output per panggilan untuk proyeksi "expected" (dari smoke G-31, 445-452).
expected_output_tokens = 450

# Usulan agen, BELUM DIUKUR: latensi per panggilan berurutan untuk proyeksi waktu. Ukur pada sampel live.
assumed_latency_ms = 3000

# Hentikan run bila sekian panggilan berturut-turut gagal (cegah membakar kuota saat key/model bermasalah).
max_consecutive_errors = 5

# Guard cache (H-074): setelah sekian panggilan berbayar pertama (bukan cache hit lokal, tanpa pemanas), bila rasio
# agregat cached/input di bawah batas, run berhenti (`cache_ratio_low`). Pecahan string agar perbandingan eksak; batas inklusif.
cache_guard_calls = 10
cache_guard_min_ratio = "4/5"

[projection]
# RPM dokumentasi Contributor (H-028); proyeksi default memakai [limits].max_rpm config/model (140, G-19).
doc_rpm = 150

[projection.glimmer_local]
# H-101 Q-B10 / S17: parameter proyeksi WAKTU Glimmer lokal (regresi O1, `_kerja/orkestrasi/open/O1-proyeksi.md`); dipin sebelum run.
# Waktu satu panggilan = prefill + base_ms + keluaran. prefill (ms) = ceil(token * 1000 / prefill_tokens_per_s); keluaran (ms) =
# ceil(token * 10000 / output_tokens_per_10s) (23,7 token/dtk = 237 per 10 dtk). Semua integer; tanpa float.
prefill_tokens_per_s = 650
base_ms = 4800
output_tokens_per_10s = 237

[factor_bp]
# H-101 Q-B3: faktor ulang G-36 per profil (basis point) terukur dari pilot, dipakai bila lebih besar dari [batch_gate].factor_bp.
# baseten_open: pilot 28 Okt 20 unit UU PT pasal, belanja aktual 413.717 / expected ronde 1 249.935 = 1,6553 (16553 bp, dibulatkan ke atas).
# Laporan run runs/headers_compare/baseten_open/runs/20261028T135414Z.json.
baseten_open = 16553

[max_attempts]
# H-101 P14 / Q-B3: sampai N upaya total per unit untuk run B pembanding, per profil di config/model (integer >= 1).
# Baseten membayar prefiks ter-cache + pemanas tiap ronde (G-36); Glimmer kehilangan 45-120 dtk per panggilan gagal.
baseten_open = 8
glimmer_local = 3
