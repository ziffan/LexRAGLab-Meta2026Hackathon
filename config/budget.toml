# config/budget — cost guard (SECURITY-COMPLIANCE T6). Uang integer micro-USD.
version = 2   # H-101 P16: tabel [provider_cap_micros] mensyaratkan version >= 2
# Cap dev semalam 27 Okt (mandat operator, brief L2): Meta + OpenRouter digabung.
dev_total_cap_micros = 2000000

[per_role_cap_micros]
measure = 500000
# Cap per peran: disetujui operator 2026-10-27 (putusan operator 2; asal usulan M0.1 O-11; peran tanpa cap = config_invalid).
# Jumlahnya di bawah dev_total_cap_micros; cap total tetap berlaku.
a = 500000
b = 1000000
c = 500000
d = 250000

[provider_cap_micros]
# H-100/H-101 P6: plafon pool per provider (integer micro-USD >= 0; 0 = nol, bukan tanpa batas). Provider tercantum punya pool
# sendiri: dev_total_cap_micros dan per_role_cap_micros TIDAK berlaku untuk pool itu; provider lain (meta, openrouter,
# lmstudio_local) = pool default. Baseten naik 10M -> 20M micro-USD (nilai diputus operator, H-100).
baseten = 20000000

[batch_gate]
# H-092 P10 / G-36: gerbang proyeksi batch Spark (fungsi murni backend/proposal/gate.py). Ditolak bila
# batas_atas > batch_cap_micros ATAU kumulatif_terpakai + batas_atas > cumulative_cap_micros * cumulative_pct / 100.
# factor_bp = faktor ulang G-36 dalam basis point (15700 = 1,57); ASUMSI dari peran B (121.725 / 77.533 = 1,56997), belum
# diukur untuk D. Plafon kumulatif 20.000.000 = putusan operator 27 Okt malam (bukan cap dev_total di atas).
factor_bp = 15700
batch_cap_micros = 2000000
cumulative_cap_micros = 20000000
cumulative_pct = 80
