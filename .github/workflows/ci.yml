name: CI

# push only: no pull_request / pull_request_target, so the HF_TOKEN secret never reaches fork code.
on:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24: frontend/package.json has no engines and there is no .nvmrc; Node 24 is the
      # version used locally and satisfies the vite/vitest ranges in package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space (torch cu128 + nvidia wheels need ~7-9 GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      # Gated tokenizer files (G-32): fetched with the secret, never via actions/cache.
      # Repo and revision are read from config/tokenizer.toml, not hardcoded here.
      - name: Fetch tokenizer files (gated HF repo)
        env:
          HF_HOME: ${{ runner.temp }}/hf
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN secret not set"
            exit 1
          fi
          uv run --frozen python - <<'PY'
          import os, tomllib
          from huggingface_hub import hf_hub_download

          with open("config/tokenizer.toml", "rb") as f:
              cfg = tomllib.load(f)["muse-spark-open"]
          for name in ("tokenizer.json", "tokenizer_config.json", "special_tokens_map.json"):
              hf_hub_download(
                  repo_id=cfg["hf_repo"],
                  revision=cfg["hf_revision"],
                  filename=name,
                  token=os.environ["HF_TOKEN"],
              )
          print("tokenizer files fetched")
          PY
      # Deselected: needs BAAI/bge-m3 weights, which are not available in CI (G-49).
      - name: pytest
        env:
          HF_HOME: ${{ runner.temp }}/hf
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          uv run --frozen pytest -q
          --deselect backend/tests/test_s11_s12_grid_compare_sweep.py::test_s11_mask_ref_reference_failure_leaves_no_envelope_and_retry_writes_both
