name: CI

# push and manual dispatch only; no secrets are used.
on:
  push:
    branches: [main, "ci/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24: frontend/package.json has no engines and there is no .nvmrc; Node 24 is the
      # version used locally and satisfies the vite/vitest ranges in package-lock.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  # Light backend subset (docs/TESTING.md): no torch/CUDA wheels, empty HF cache, offline, no secrets.
  # Ignored files need torch or the gated Muse Spark Open tokenizer (G-32); they run locally only.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync without torch and CUDA packages
        run: >-
          uv sync --frozen
          --no-install-package torch
          --no-install-package cuda-bindings
          --no-install-package cuda-pathfinder
          --no-install-package cuda-toolkit
          --no-install-package nvidia-cublas-cu12
          --no-install-package nvidia-cudnn-cu12
          --no-install-package nvidia-cusparselt-cu12
          --no-install-package nvidia-nccl-cu12
          --no-install-package nvidia-nvshmem-cu12
          --no-install-package triton
          --no-install-package sympy
          --no-install-package mpmath
          --no-install-package networkx
      - name: pytest (light subset)
        env:
          HF_HOME: ${{ runner.temp }}/hf-empty
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >-
          uv run --no-sync pytest -q
          --ignore=backend/tests/test_answer_api.py
          --ignore=backend/tests/test_answer_context.py
          --ignore=backend/tests/test_api_docs.py
          --ignore=backend/tests/test_api_m1.py
          --ignore=backend/tests/test_chunking_chunkers.py
          --ignore=backend/tests/test_fix_video_v1.py
          --ignore=backend/tests/test_h101_gpulock.py
          --ignore=backend/tests/test_header_b_akta_family.py
          --ignore=backend/tests/test_header_b_api.py
          --ignore=backend/tests/test_header_b_core.py
          --ignore=backend/tests/test_header_b_h079.py
          --ignore=backend/tests/test_header_store_family.py
          --ignore=backend/tests/test_m25_w6_cli.py
          --ignore=backend/tests/test_measure.py
          --ignore=backend/tests/test_proposal_report.py
          --ignore=backend/tests/test_r3_akta_s4.py
          --ignore=backend/tests/test_replay_m51.py
          --ignore=backend/tests/test_retrieval_dense.py
          --ignore=backend/tests/test_s11_s12_grid_compare_sweep.py
          --ignore=backend/tests/test_s13_s14_s20_a_c_sweep.py
          --ignore=backend/tests/test_s19_w6_health_golden.py
          --ignore=backend/tests/test_s8_main_grid_byte_identity.py
          --ignore=backend/tests/test_s9c_s10_s16_sweep_closing.py
          --ignore=backend/tests/test_w51_profiles_fix.py
          --ignore=backend/tests/test_w66_profile_akta.py
          --ignore=backend/tests/test_w6_schema_binding.py
